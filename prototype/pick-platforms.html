<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick platforms · Conversion Tracking 3.0 prototype</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
</head>
<body data-page="pick-platforms" data-shell="wizard">
<div class="wp-content">
<main class="page wcct-app" id="wcct-app">

	<div class="center">
		<h1 class="page-title is-hero">Where do you run ads?</h1>
		<p class="lead">Pick the platforms you use today. You can add more later. Nothing is sent until you connect one.</p>
	</div>

	<div class="tile-grid">
		<button type="button" class="pick-tile" data-platform="meta" aria-pressed="true">
			<span class="pill ok no-dot popular">Popular</span>
			<span class="tick"><span data-icon="check"></span></span>
			<span class="logo lg"><img src="assets/logos/meta.svg" alt=""></span>
			<span><span class="pick-tile-name">Meta</span><span class="pick-tile-desc">Facebook and Instagram ads</span></span>
		</button>
		<button type="button" class="pick-tile" data-platform="google" aria-pressed="true">
			<span class="pill ok no-dot popular">Popular</span>
			<span class="tick"><span data-icon="check"></span></span>
			<span class="logo lg"><img src="assets/logos/google-analytics.svg" alt=""></span>
			<span><span class="pick-tile-name">Google</span><span class="pick-tile-desc">Analytics, Ads, or both</span></span>
		</button>
		<button type="button" class="pick-tile" data-platform="x" aria-pressed="false">
			<span class="tick"><span data-icon="check"></span></span>
			<span class="logo lg"><img src="assets/logos/x.svg" alt=""></span>
			<span><span class="pick-tile-name">X</span><span class="pick-tile-desc">formerly Twitter</span></span>
		</button>
		<button type="button" class="pick-tile" data-platform="microsoft" aria-pressed="false">
			<span class="tick"><span data-icon="check"></span></span>
			<span class="logo lg"><img src="assets/logos/microsoft.svg" alt=""></span>
			<span><span class="pick-tile-name">Microsoft Advertising <span class="pro-badge" data-when="plan=free"><span data-icon="pui-crown"></span>PRO</span></span><span class="pick-tile-desc">Bing and Microsoft Start ads</span></span>
		</button>
		<button type="button" class="pick-tile" data-platform="custom" aria-pressed="false">
			<span class="tick"><span data-icon="check"></span></span>
			<span class="logo lg"><img src="assets/logos/custom.svg" alt=""></span>
			<span><span class="pick-tile-name">Custom script</span><span class="pick-tile-desc">Paste any other tag</span></span>
		</button>
		<div class="pick-tile is-soon">TikTok and Pinterest arrive in a later update. <a href="#">Tell us if you need them sooner.</a></div>
	</div>

	<div class="pick-foot">
		<p class="pick-count" data-pick-count aria-live="polite">2 selected. About 3 minutes each.</p>
		<a class="btn primary lg" href="platforms.html" data-pick-continue>Continue to connect Meta</a>
	</div>

</main>
</div>
<script src="assets/icons.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
